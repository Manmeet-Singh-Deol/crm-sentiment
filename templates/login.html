<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AURA CRM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Extra styles for login page to center the glassmorphic card */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-color: var(--bg-main);
            position: relative;
            z-index: 1;
        }
        
        .login-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 30% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 70% 70%, rgba(217, 70, 239, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.003) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.003) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            z-index: -2;
            pointer-events: none;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 3rem 2.5rem;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
            text-align: center;
        }
        
        .login-brand .brand-logo {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 14px;
        }
        
        .login-brand .brand-logo svg {
            width: 1.8rem;
            height: 1.8rem;
        }
        
        .login-brand h1 {
            font-family: var(--font-display);
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-brand p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            transition: var(--transition-smooth);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            background: rgba(99, 102, 241, 0.05);
            box-shadow: 0 0 12px var(--border-focus);
        }

        .error-banner {
            background: var(--color-atrisk-bg);
            border: 1px solid var(--color-atrisk-border);
            color: var(--color-atrisk);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
            font-weight: 500;
            margin-bottom: 1.25rem;
        }

        .quick-access-section {
            margin-top: 2rem;
            border-top: 1px solid var(--border-card);
            padding-top: 1.5rem;
            text-align: center;
        }

        .quick-access-title {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .quick-access-btns {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        .btn-quick {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-card);
            color: var(--text-secondary);
            padding: 0.5rem 0.85rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-quick:hover {
            background: rgba(99, 102, 241, 0.08);
            border-color: rgba(99, 102, 241, 0.2);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card glass-panel">
            <div class="login-brand">
                <div class="brand-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.361-6.867 8.21 8.21 0 0 0 3 2.48Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18a3.75 3.75 0 0 0 .495-7.467 5.99 5.99 0 0 0-1.925 3.546 5.974 5.974 0 0 1-2.133-1A3.75 3.75 0 0 0 12 18Z" />
                    </svg>
                </div>
                <h1>AURA CRM</h1>
                <p>Sign in to manage client relations & sentiment analytics</p>
            </div>

            {% if request.args.get('success') %}
            <div class="success-banner" style="background: var(--color-happy-bg); border: 1px solid var(--color-happy-border); color: var(--color-happy); padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.8rem; text-align: center; font-weight: 500; margin-bottom: 1.25rem;">
                {{ request.args.get('success') }}
            </div>
            {% endif %}

            {% if error %}
            <div class="error-banner">
                {{ error }}
            </div>
            {% endif %}

            <form class="login-form" method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Enter username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem; width: 100%;">Sign In</button>
            </form>

            <div style="margin-top: 1.25rem; text-align: center; font-size: 0.82rem; color: var(--text-secondary);">
                Don't have an account? <a href="/register" style="color: var(--color-primary); text-decoration: none; font-weight: 600; transition: var(--transition-smooth);" onmouseover="this.style.color='var(--color-accent)'" onmouseout="this.style.color='var(--color-primary)'">Sign Up</a>
            </div>

            <div class="quick-access-section">
                <div class="quick-access-title">Quick Access (Recruiter Sandbox)</div>
                <div class="quick-access-btns">
                    <button type="button" class="btn-quick" onclick="autoLogin('{{ admin_username }}', '{{ admin_password }}')">Login as Admin</button>
                    <button type="button" class="btn-quick" onclick="autoLogin('staff', 'staff123')">Login as Staff</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function autoLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            document.querySelector('.login-form').submit();
        }
    </script>
</body>
</html>
