<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AURA CRM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-color: var(--bg-main);
            position: relative;
            z-index: 1;
        }
        
        .login-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 30% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 70% 70%, rgba(217, 70, 239, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.003) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.003) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            z-index: -2;
            pointer-events: none;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 3rem 2.5rem;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .login-brand .brand-logo {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 14px;
        }
        
        .login-brand .brand-logo svg {
            width: 1.8rem;
            height: 1.8rem;
        }
        
        .login-brand h1 {
            font-family: var(--font-display);
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-brand p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            transition: var(--transition-smooth);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            background: rgba(99, 102, 241, 0.05);
            box-shadow: 0 0 12px var(--border-focus);
        }

        .error-banner {
            background: var(--color-atrisk-bg);
            border: 1px solid var(--color-atrisk-border);
            color: var(--color-atrisk);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
            font-weight: 500;
            margin-bottom: 1.25rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.65rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-smooth);
            flex: 1;
            text-align: center;
        }

        .tab-btn.active {
            background: rgba(99, 102, 241, 0.15);
            color: white;
            border: 1px solid rgba(99, 102, 241, 0.25);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card glass-panel">
            <div class="login-brand">
                <div class="brand-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.361-6.867 8.21 8.21 0 0 0 3 2.48Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18a3.75 3.75 0 0 0 .495-7.467 5.99 5.99 0 0 0-1.925 3.546 5.974 5.974 0 0 1-2.133-1A3.75 3.75 0 0 0 12 18Z" />
                    </svg>
                </div>
                <h1>AURA CRM</h1>
                <p>Sign in to manage client relations & sentiment analytics</p>
            </div>

            {% if request.args.get('success') %}
            <div class="success-banner" style="background: var(--color-happy-bg); border: 1px solid var(--color-happy-border); color: var(--color-happy); padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.8rem; text-align: center; font-weight: 500; margin-bottom: 1.25rem;">
                {{ request.args.get('success') }}
            </div>
            {% endif %}

            {% if error %}
            <div class="error-banner">
                {{ error }}
            </div>
            {% endif %}

            <!-- Tab switcher -->
            <div style="display: flex; gap: 0.5rem; background: rgba(255,255,255,0.015); border: 1px solid var(--border-card); padding: 0.35rem; border-radius: 10px; margin-bottom: 1.5rem;">
                <button type="button" id="btn-tab-admin" class="tab-btn active" onclick="switchTab('admin')">Admin Portal</button>
                <button type="button" id="btn-tab-staff" class="tab-btn" onclick="switchTab('staff')">Staff Portal</button>
                <button type="button" id="btn-tab-client" class="tab-btn" onclick="switchTab('client')">Client Portal</button>
            </div>

            <!-- Staff & Admin Login Form -->
            <form id="form-staff" class="login-form" method="POST" action="/login">
                <div class="form-group">
                    <label id="label-username" for="username">Admin Username</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Enter admin username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <button type="submit" id="btn-submit" class="btn btn-primary" style="margin-top: 0.5rem; width: 100%;">Sign In as Admin</button>
            </form>

            <!-- Client Login Form -->
            <form id="form-client" class="login-form" method="POST" action="/login" style="display: none;">
                <div class="form-group">
                    <label for="client_email">Client Email Address</label>
                    <input type="email" id="client_email" name="client_email" class="form-input" placeholder="Enter your registered email address" autocomplete="email">
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem; width: 100%; background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 100%);">Access Client Support</button>
            </form>

            <div style="margin-top: 2rem; border-top: 1px solid var(--border-card); padding-top: 1.25rem; text-align: center; font-size: 0.82rem; color: var(--text-secondary);">
                Don't have a staff account? <a href="/register" style="color: var(--color-primary); text-decoration: none; font-weight: 600; transition: var(--transition-smooth);" onmouseover="this.style.color='var(--color-accent)'" onmouseout="this.style.color='var(--color-primary)'">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        function switchTab(type) {
            const btnAdmin = document.getElementById('btn-tab-admin');
            const btnStaff = document.getElementById('btn-tab-staff');
            const btnClient = document.getElementById('btn-tab-client');
            const formStaff = document.getElementById('form-staff');
            const formClient = document.getElementById('form-client');
            
            const labelUsername = document.getElementById('label-username');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const clientEmail = document.getElementById('client_email');
            const btnSubmit = document.getElementById('btn-submit');
            
            // Remove active class from all tab buttons
            btnAdmin.classList.remove('active');
            btnStaff.classList.remove('active');
            btnClient.classList.remove('active');
            
            if (type === 'admin') {
                btnAdmin.classList.add('active');
                formStaff.style.display = 'flex';
                formClient.style.display = 'none';
                
                labelUsername.textContent = 'Admin Username';
                usernameInput.placeholder = 'Enter admin username';
                btnSubmit.textContent = 'Sign In as Admin';
                
                // Toggle required tags
                usernameInput.required = true;
                passwordInput.required = true;
                clientEmail.required = false;
            } else if (type === 'staff') {
                btnStaff.classList.add('active');
                formStaff.style.display = 'flex';
                formClient.style.display = 'none';
                
                labelUsername.textContent = 'Staff Username';
                usernameInput.placeholder = 'Enter staff username';
                btnSubmit.textContent = 'Sign In as Staff';
                
                // Toggle required tags
                usernameInput.required = true;
                passwordInput.required = true;
                clientEmail.required = false;
            } else {
                btnClient.classList.add('active');
                formStaff.style.display = 'none';
                formClient.style.display = 'flex';
                
                // Toggle required tags
                usernameInput.required = false;
                passwordInput.required = false;
                clientEmail.required = true;
            }
        }
    </script>
</body>
</html>
